services:
  - type: web
    name: shopmate-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_CHAT_MODEL
        value: sarvam-105b
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_SPEAKER
        value: shubh
